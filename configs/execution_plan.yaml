# Shot/time budget plan for the 14 QAOA-TCS / IGDec-QAOA combos in this
# replication package. See piastq_execution/budget_planner.py for the model.
#
# The `combos` section defines *what* each combo needs (used to discover its
# real circuit inventory under trained_qaoa_circuits/) and *which mitigation
# methods* it should be evaluated with. The `pools` section defines *when/
# where* those combos actually get to run: each pool is an independent time
# budget with an explicit combo list. This example mixes granularities on
# purpose -- one pool per objective-mode for QAOA-TCS, one pool per dataset
# for IGDec-QAOA -- to show that "global" (one pool, all 14 combos) and
# "per_combo" (14 pools of one combo each) are just two points on the same
# spectrum, not separate modes. Edit `pools:` freely; nothing else needs to
# change.

seconds_per_batch: 18.4974     # BILLED QPU time of one 200-shot batch on PIAST-Q (measured 2026-10-29 from the
                                # account usage counter: 18.4974 s for 1-, 3- and 7-qubit circuits alike; 100 shots
                                # billed 10.0774 s). Queue wait is not billed. The operators' figure was 15 s.
shots_per_batch_cap: 200        # hardware constraint: max shots per run
target_shots_per_circuit: 200   # reduced-scope run: one 200-shot batch per circuit (hardware floor)
min_shots_per_circuit: 200      # floor: never go below one batch
target_repetitions: 5           # reduced-scope run: 5 repetitions (paper convention is 10; not affordable in 25 QPU-h)
calibration_shots_per_circuit: 200
trex_twirl_instances: 2         # independent random-twirl hardware passes averaged per
                                 # TREx circuit (see piastq_execution/mitigation.py's
                                 # load_trex_twirl_instances() docstring for rationale).
                                 # Read by both the budget planner's cost model and every
                                 # execution script's actual TREx loop -- change it here
                                 # once, not per script.

combos:
  # ---- QAOA-TCS, single-objective (5) ----
  gsdtsr_qaoa_tcs:
    algorithm: qaoa_tcs
    objective_mode: single_objective
    dataset: gsdtsr
    circuits_dir: gsdtsr
    methods: [raw, mem, m3, trex]
  iofrol_qaoa_tcs:
    algorithm: qaoa_tcs
    objective_mode: single_objective
    dataset: iofrol
    circuits_dir: iofrol
    methods: [raw, mem, m3, trex]
  paintcontrol_qaoa_tcs:
    algorithm: qaoa_tcs
    objective_mode: single_objective
    dataset: paintcontrol
    circuits_dir: paintcontrol
    methods: [raw, mem, m3, trex]
  elevator_qaoa_tcs:
    algorithm: qaoa_tcs
    objective_mode: single_objective
    dataset: elevator
    circuits_dir: elevator
    methods: [raw, mem, m3, trex]
  elevator2_qaoa_tcs:
    algorithm: qaoa_tcs
    objective_mode: single_objective
    dataset: elevator2
    circuits_dir: elevator2
    methods: [raw, mem, m3, trex]

  # ---- QAOA-TCS, multi-objective (4) ----
  flex_qaoa_tcs:
    algorithm: qaoa_tcs
    objective_mode: multi_objective
    dataset: flex
    circuits_dir: flex
    methods: [raw, mem, m3, trex]
  grep_qaoa_tcs:
    algorithm: qaoa_tcs
    objective_mode: multi_objective
    dataset: grep
    circuits_dir: grep
    methods: [raw, mem, m3, trex]
  gzip_qaoa_tcs:
    algorithm: qaoa_tcs
    objective_mode: multi_objective
    dataset: gzip
    circuits_dir: gzip
    methods: [raw, mem, m3, trex]
  sed_qaoa_tcs:
    algorithm: qaoa_tcs
    objective_mode: multi_objective
    dataset: sed
    circuits_dir: sed
    methods: [raw, mem, m3, trex]

  # ---- IGDec-QAOA, single-objective only (5) ----
  gsdtsr_igdec_qaoa:
    algorithm: igdec_qaoa
    objective_mode: single_objective
    dataset: gsdtsr
    circuits_dir: gsdtsr
    methods: [raw, mem, m3, trex]
  iofrol_igdec_qaoa:
    algorithm: igdec_qaoa
    objective_mode: single_objective
    dataset: iofrol
    circuits_dir: iofrol
    methods: [raw, mem, m3, trex]
  paintcontrol_igdec_qaoa:
    algorithm: igdec_qaoa
    objective_mode: single_objective
    dataset: paintcontrol
    circuits_dir: paintcontrol
    methods: [raw, mem, m3, trex]
  elevator_o2_igdec_qaoa:
    algorithm: igdec_qaoa
    objective_mode: single_objective
    dataset: elevator_o2
    circuits_dir: elevator_two
    methods: [raw, mem, m3, trex]
  elevator_o3_igdec_qaoa:
    algorithm: igdec_qaoa
    objective_mode: single_objective
    dataset: elevator_o3
    circuits_dir: elevator_three
    methods: [raw, mem, m3, trex]

# Reduced-scope run (25 QPU-hours available, results needed by 6 Nov):
# ONE pool, four QAOA-TCS combos (2 multi-objective: gzip, flex; 2 single-
# objective: paintcontrol, gsdtsr), all four methods (raw+MEM+M3+TREx),
# 5 repetitions, 200 shots/circuit, 2 TREx twirls. IGDec-QAOA is not part of
# this run. At the measured 18.4974 s/batch the planner estimates ~22.4h
# (+~0.29h end-of-session drift check); total_hours is set to 23 so ~2h of
# the 25h stays unplanned as a reserve for failed jobs. Any combo NOT listed
# here is skipped by the execution scripts and by evaluation.
pools:
  - name: reduced_scope_run
    total_hours: 23
    combos: [gzip_qaoa_tcs, flex_qaoa_tcs, paintcontrol_qaoa_tcs, gsdtsr_qaoa_tcs]
