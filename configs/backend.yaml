# Single source of truth for the AQT/PIAST-Q API token and backend name used
# by every script that opens a real (or simulated) quantum backend:
#   qaoa_tcs/single_obj.py, qaoa_tcs/multi_obj.py,
#   igdec_qaoa/loch_qaoa_tcm_extract_circuits.py,
#   igdec_qaoa/loch_qaoa_elev_two_extract_circuits.py,
#   igdec_qaoa/loch_qaoa_elev_three_extract_circuits.py,
#   piastq_execution/run_calibration.py
#
# To switch from the local offline simulator to real PIAST-Q hardware, edit
# ONLY this file (or set the PIASTQ_API_TOKEN / PIASTQ_BACKEND_NAME
# environment variables, which take precedence over these values -- useful
# for keeping the real token out of version control). No script needs to be
# touched.

api_token: ACCESS_TOKEN
backend_name: offline_simulator_no_noise

# Ordered list of physical PIAST-Q qubits every circuit gets transpiled onto,
# read by piastq_execution.qubit_layout. A width-`w` circuit always uses the
# first `w` entries of this list -- real QAOA/TREx execution AND MEM/M3
# calibration circuits alike -- so calibration is guaranteed to be built from
# the *same* physical qubits the real circuits actually ran on, not merely
# assumed to match. Defaults to [0, 1, 2, 3, 4, 5, 6] if this key is absent.
# Update this list (not the code) if PIAST-Q's real qubit numbering, or which
# specific physical qubits you want to dedicate to this study, changes.
physical_qubits: [0, 1, 2, 3, 4, 5, 6]

# Fixed qubit SLOTS used to pack several circuits into one hardware job
# (piastq_execution/packing.py): [first physical qubit, width]. Every job
# holds circuits side by side on disjoint qubits inside these slots, and the
# MEM/M3 calibration is measured on the same slots. Slots must not overlap;
# the widest circuit (7 qubits) must fit the widest slot. The default uses
# qubits 0..19 of PIAST-Q. `physical_qubits` above is only used when a single
# circuit is run on its own (no packing).
pack_slots: [[0, 7], [7, 7], [14, 6]]
